<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1446">
<title>Hemtam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hemtam">

<style>
:root{--navy:#0A1446;--blue:#141E69;--gold:#FFB400;--bg:#ECECEF;--line:#DDD9D9;--grey:#7D7373;--red:#B43C32;--dred:#6E120B;--green:#436544;--lgreen:#ACC196;--cream:#FFFAD7;--ice:#E1EBF0;--amber:#C08226;--bd:#C9CED9;--lcd:#CCD8D2;--lcdt:#2A3352}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#161B36;color:var(--navy);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* Scen: telefonram på dator, helskärm på mobil */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:24px}
.side{color:#fff;max-width:300px;font-size:14px;line-height:1.5;opacity:.92}
.side h1{font-size:26px;letter-spacing:4px;margin:10px 0 2px}
.side .v{color:var(--gold);font-weight:700;letter-spacing:1.5px;font-size:12px}
.side code{background:rgba(255,255,255,.12);border-radius:4px;padding:1px 6px;font-weight:700}
.side img{height:56px}
.side p{margin:10px 0}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));min-height:600px;background:var(--bg);border-radius:46px;border:12px solid #04060D;box-shadow:0 0 0 2px #2C3354,0 30px 80px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:640px){.stage{padding:0;display:block}.side{display:none}.phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}}
body.big .stage{padding:0;display:block}body.big .side{display:none}body.big .phone{width:100%;height:100vh;border:0;border-radius:0;min-height:0}
/* Sidhuvud */
.top{background:var(--navy);height:56px;flex:none;display:flex;align-items:center;padding:0 14px;color:#fff;gap:10px}
.top img{height:32px}
.brand{font-weight:700;font-size:19px;letter-spacing:3px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font-weight:700;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.ib{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:6px;height:32px;min-width:32px;padding:0 7px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.ib svg{width:18px;height:18px}
.nav{background:var(--blue);flex:none;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.nav::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:#fff;font-weight:700;font-size:13px;letter-spacing:1px;padding:13px 11px 10px;text-transform:uppercase;white-space:nowrap;flex:1}
.tab.on{color:var(--gold);border-color:var(--gold)}
.testbar{flex:none;background:var(--gold);color:var(--navy);font-size:11.5px;font-weight:700;padding:5px 12px;display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--navy)}
.testbar b{background:var(--navy);color:var(--gold);border-radius:3px;padding:1px 6px;letter-spacing:1.2px}
.scr{flex:1;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
.dock{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.dock:empty{display:none}
.scan{width:100%;background:var(--gold);border:0;border-radius:10px;height:58px;font-weight:800;font-size:18px;letter-spacing:3px;color:var(--navy);display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 3px 0 #C08226}
.scan:active{transform:translateY(2px);box-shadow:0 1px 0 #C08226}
.scan svg{width:26px;height:26px}
/* Kort */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(10,20,70,.08);margin-bottom:12px;overflow:hidden}
.h{font-size:12px;font-weight:700;letter-spacing:1.2px;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;text-transform:uppercase}
.h small{font-weight:600;letter-spacing:0;color:var(--grey);text-transform:none;margin-left:auto}
.pad{padding:12px 14px}
.st{font-size:12px;color:var(--grey);line-height:1.4}
.btn{border:1px solid var(--bd);border-radius:7px;padding:11px 16px;font-weight:700;background:#fff;font-size:14px}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.ml{margin-left:auto}
/* Profilkort */
.prof{background:var(--navy);color:#fff;border-radius:10px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.prof:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:18px solid rgba(255,180,0,.12)}
.prof .sig{font-size:30px;font-weight:800;letter-spacing:3px}
.prof .lvl{color:var(--gold);font-weight:700;letter-spacing:1.5px;font-size:13px;text-transform:uppercase}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.prof .st{color:rgba(255,255,255,.75)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:8px;padding:10px 8px;text-align:center;box-shadow:0 1px 2px rgba(10,20,70,.08)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:1px;color:var(--grey);font-weight:700;text-transform:uppercase}
.med{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;color:var(--navy);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.m1{background:#FFB400}.m2{background:#C9CED9}.m3{background:#C98A4B;color:#fff}
.meds{display:flex;gap:6px;justify-content:center;align-items:center;font-weight:800;font-size:14px}
.big-go{width:100%;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:20px 16px;text-align:left;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.big-go b{display:block;font-size:19px;letter-spacing:1.5px}
.big-go span{font-size:13px;opacity:.8}
.big-go .arr{margin-left:auto;background:var(--gold);color:var(--navy);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none}
/* Uppdrag */
.tag{display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.t-hitta{background:var(--blue);color:#fff}.t-tid{background:var(--gold);color:var(--navy)}.t-kedja{background:var(--green);color:#fff}.t-fraga{background:var(--ice);color:var(--navy)}.t-larm{background:var(--red);color:#fff}
.mis{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(10,20,70,.12);overflow:hidden;margin-bottom:12px;border-top:6px solid var(--blue)}
.mis.tid{border-color:var(--gold)}.mis.kedja{border-color:var(--green)}.mis.fraga{border-color:#9DB8C7}.mis.larm{border-color:var(--red)}
.mis .in{padding:16px}
.mis h2{margin:8px 0 6px;font-size:22px;line-height:1.2}
.mis p{margin:0 0 10px;font-size:16px;line-height:1.45}
.goal{background:var(--cream);border-radius:8px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center}
.goal small{display:block;font-size:10px;letter-spacing:1.2px;color:var(--grey);font-weight:800}
.goal b{font-size:17px}
.tmr{font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;padding:8px 0 0;color:var(--navy)}
.tmr small{display:block;font-size:11px;letter-spacing:2px;color:var(--grey);font-weight:800}
.dots{display:flex;gap:6px;margin:10px 0}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--green)}.dots i.now{background:var(--gold)}
.abort{background:none;border:0;color:var(--grey);font-size:13px;text-decoration:underline;padding:8px;display:block;margin:0 auto}
/* Larmenhet */
.dev{position:relative;width:64%;max-width:300px;margin:0 auto 6px;aspect-ratio:504/780}
.dev img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.lcd{position:absolute;left:18%;top:25.3%;width:56.9%;height:25.6%;background:var(--lcd);border-radius:2px;color:var(--lcdt);font-family:"Lucida Console","Consolas","Courier New",monospace;font-weight:700;display:flex;flex-direction:column;padding:3% 4% 0;overflow:hidden;container-type:inline-size}
.lcd .l{display:flex;justify-content:space-between;align-items:center;font-size:8.5cqw;line-height:1.25;white-space:nowrap}
.lcd .ad{font-size:11cqw;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd .lt{font-size:13cqw;letter-spacing:1px;line-height:1.1}
.lcd .sk{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:4%;font-size:7.5cqw;text-align:center;padding-bottom:2%}
.lcd .sk span{border:1px solid var(--lcdt);border-bottom:0;padding:1% 0}
.lcd.blink{animation:bl .55s steps(1) infinite}
@keyframes bl{50%{background:#F3F7E8;box-shadow:0 0 18px 4px rgba(243,247,232,.7)}}
.hot{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:0;background:transparent}
.hot:active{background:rgba(255,180,0,.35)}
.dev.wait .hot.k{box-shadow:0 0 0 3px rgba(255,180,0,.9);animation:pu 1s infinite}
@keyframes pu{50%{box-shadow:0 0 0 7px rgba(255,180,0,.25)}}
.hint{background:var(--cream);border-left:4px solid var(--amber);border-radius:6px;padding:10px 12px;font-size:14px;margin:6px 0 10px}
.lead{text-align:center;font-size:14px;color:var(--grey);margin:4px 0 8px}
/* Fråga */
.q{font-size:19px;font-weight:700;line-height:1.3;margin:4px 0 14px}
.alt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:9px;padding:15px 14px;margin-bottom:9px;font-size:16px;font-weight:600}
.alt.ok{border-color:var(--green);background:#e3ecdc}.alt.no{border-color:var(--red);background:#f6dcd8}
/* Resultat */
.res{position:absolute;inset:0;background:var(--navy);color:#fff;z-index:30;display:none;flex-direction:column;overflow-y:auto}
.res.show{display:flex}
.res .hd{text-align:center;padding:30px 18px 10px}
.res .ck{width:84px;height:84px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.res .ck svg{width:46px;height:46px}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.res h2{margin:0;font-size:26px;letter-spacing:3px}
.res .pl{color:var(--gold);font-size:18px;font-weight:700;margin-top:4px}
.res .bigt{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;margin:12px 0 0}
.ribbon{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;letter-spacing:2px;font-size:13px;padding:5px 14px;border-radius:4px;margin-top:10px}
.pts{margin:14px 18px 0;background:rgba(255,255,255,.07);border-radius:8px;padding:6px 14px}
.pts div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px}
.pts div:last-child{border:0;font-weight:800;font-size:17px;color:var(--gold)}
.newb{margin:14px 18px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.info{margin:14px 18px 0;background:#fff;color:var(--navy);border-radius:8px;padding:14px}
.info small{font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--grey)}
.info p{margin:6px 0 0;line-height:1.45;white-space:pre-wrap}
.res .acts{padding:18px;margin-top:auto;display:grid;gap:9px}
/* Märken */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{text-align:center;font-size:11.5px;font-weight:700;line-height:1.25}
.bdg .ic{width:62px;height:62px;margin:0 auto 6px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid var(--gold);box-shadow:0 2px 0 #C08226}
.bdg.off{opacity:.35}.bdg.off .ic{background:#9AA0B5;color:#fff;border-color:#C9CED9;box-shadow:none}
.bdg span{display:block;font-weight:600;color:var(--grey);font-size:10.5px;margin-top:2px}
.res .bdg{color:#fff}.res .bdg span{color:rgba(255,255,255,.7)}
.ladder{display:flex;flex-direction:column;gap:6px}
.ladder div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;background:var(--bg);font-weight:700}
.ladder div.on{background:var(--navy);color:var(--gold)}
.ladder div.done{color:var(--green)}
.ladder i{font-style:normal;margin-left:auto;font-size:11px;color:var(--grey);font-weight:600}
/* Topplista */
.seg{display:flex;background:#fff;border-radius:8px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:0 1px 2px rgba(10,20,70,.08)}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:9px 4px;font-weight:700;font-size:12.5px;letter-spacing:.5px}
.seg button.on{background:var(--blue);color:#fff}
.lb{width:100%;border-collapse:collapse}
.lb td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px}
.lb td.n{width:44px;text-align:center;font-weight:800;color:var(--grey)}
.lb td.s{font-weight:800;letter-spacing:1.5px}
.lb td.v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.lb tr.me td{background:var(--cream)}
.crown{display:inline-block;width:18px;height:14px;vertical-align:-1px;margin-left:5px}
.empty{padding:20px 14px;color:var(--grey);font-style:italic;font-size:14px}
/* Inloggning */
.login h2{font-size:15px;letter-spacing:1.5px;margin:6px 0 12px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sgrid button{background:#fff;border:2px solid var(--bd);border-radius:10px;padding:18px 4px;font-weight:800;font-size:17px;letter-spacing:2px}
.sgrid button:active{border-color:var(--gold)}
.pinw{text-align:center}
.pinw .who{font-size:28px;font-weight:800;letter-spacing:3px}
.pdots{display:flex;gap:14px;justify-content:center;margin:16px 0 8px}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
.pdots i.f{background:var(--navy)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:10px auto 0}
.keys button{height:62px;border-radius:12px;border:0;background:#fff;font-size:24px;font-weight:700;box-shadow:0 1px 2px rgba(10,20,70,.12)}
.keys button.o{background:var(--navy);color:#fff;font-size:16px;letter-spacing:1px}
.keys button.x{background:transparent;box-shadow:none;font-size:15px;color:var(--grey)}
.err{color:var(--red);font-weight:700;font-size:13px;min-height:18px;text-align:center}
/* Admin */
.sub2{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.sub2 button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:8px 11px;font-weight:700;font-size:12.5px;white-space:nowrap}
.sub2 button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li .c{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;background:var(--ice);border-radius:4px;padding:2px 7px}
.li .t{flex:1;min-width:0}.li .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--grey);margin:12px 0 4px;text-transform:uppercase}
.fi{width:100%;border:1px solid var(--bd);border-radius:6px;padding:10px;font-size:15px;background:#fff}
.fi:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 2px var(--gold)}
textarea.fi{min-height:80px;resize:vertical}
.tg{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--cream);border-radius:8px;font-size:14px}
.tg input{width:22px;height:22px}
/* Skanna */
.sheet{position:absolute;inset:0;background:rgba(10,20,70,.55);z-index:40;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sh{background:#fff;width:100%;border-radius:16px 16px 0 0;max-height:92%;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40%)}}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:1;margin:10px 0}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .fr{position:absolute;inset:16%;border:3px solid var(--gold);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.camoff{background:var(--bg);border-radius:10px;padding:16px;text-align:center;font-size:13px;color:var(--grey);margin:10px 0}
.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.codes button{border:1px solid var(--bd);background:#fff;border-radius:7px;padding:10px 4px;font-weight:800;font-size:14px}
.codes button small{display:block;font-weight:600;font-size:10px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Modal, toast */
.modal{position:absolute;inset:0;background:rgba(10,20,70,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.dlg{background:#fff;border-radius:10px;width:100%;max-height:92%;overflow:auto;padding:18px}
.dlg h3{margin:0 0 4px;font-size:18px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dlg .acts .l{margin-right:auto}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--navy);color:#fff;padding:12px 14px;border-radius:8px;display:none;z-index:60;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center}
.toast.show{display:block;animation:up .2s}
.toast.bad{background:var(--red)}.toast.good{background:var(--green)}
/* Storskärm */
.wall{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;height:100%}
.wall h2{color:var(--navy);letter-spacing:3px;font-size:22px;margin:0 0 12px}
.wall .lb td{font-size:28px;padding:14px 18px}
.wall .lb td.n{width:70px}
.wall .med{width:36px;height:36px;font-size:16px}
.feed div{background:#fff;border-radius:8px;padding:14px 18px;margin-bottom:10px;font-size:20px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 2px rgba(10,20,70,.08)}
.feed b{letter-spacing:2px}.feed .tm{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
body.big .scr{padding:28px 36px}
body.big .nav,body.big .dock,body.big .testbar{display:none}
@media (max-width:900px){.wall{grid-template-columns:1fr}}
/* v0.2 – nivåer */
.lvls .lv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.lvls .lv:last-child{border:0}
.lvls .lv.on{background:var(--cream);box-shadow:inset 4px 0 0 var(--gold)}
.lvls .lv.lk{cursor:default;opacity:.55}
.ln{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.lv.lk .ln{background:#9AA0B5;color:#fff}.ln svg{width:17px;height:17px}
.lv .lt{flex:1;min-width:0}.lv .lt b{display:block;font-size:15px}.lv .lt span{display:block;font-size:12px;color:var(--grey);line-height:1.35}
.lok{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.nvr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.nvr:last-child{border:0}.nvr .ln{margin-top:4px}
/* larm: tysta + zoom */
.dev{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:zoom-in}
.dev img{pointer-events:none}
.tysta{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;letter-spacing:3px;padding:16px;margin:6px 0 2px;box-shadow:0 3px 0 var(--dred)}
.tysta svg{width:24px;height:24px}
.zoom{position:absolute;inset:0;z-index:35;background:rgba(10,20,70,.94);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:14px}
.zoom.show{display:flex}
.zlcd{width:100%;background:var(--lcd);color:var(--lcdt);font-family:"Lucida Console","Consolas","Courier New",monospace;font-weight:700;border-radius:12px;padding:18px 16px;border:6px solid #2C3354;box-shadow:0 0 30px rgba(243,247,232,.35)}
.zl{display:flex;justify-content:space-between;font-size:20px}
.zt{font-size:44px;letter-spacing:4px;margin:10px 0 4px}
.za{font-size:38px;line-height:1.15;word-break:break-word}
.zn{font-size:28px;margin-top:6px}
.zc{font-size:30px;margin-top:14px;border-top:2px dashed var(--lcdt);padding-top:10px;font-variant-numeric:tabular-nums}
.zh{color:#fff;opacity:.7;font-size:13px;margin-top:14px}
/* statistik */
.tw{overflow-x:auto}
.stt{width:100%;border-collapse:collapse;font-size:12.5px}
.stt th{text-align:left;font-size:10.5px;letter-spacing:.8px;color:var(--grey);text-transform:uppercase;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.stt td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.stt td:not(:first-child){white-space:nowrap}
.stt tr.warn td{background:#f6dcd8}
.sub2{flex-wrap:wrap}
.prl{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.prl label{padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:14px}.prl label:last-child{border:0}
.prl input{width:20px;height:20px;flex:none;margin-top:2px}
.res .ribbon{margin-top:8px}
/* v0.3 */
.sd{background:transparent;border:0;display:flex;align-items:center;gap:4px;color:#fff;font-size:11px;font-weight:800;padding:0 2px;height:32px}
.sd i{width:10px;height:10px;border-radius:50%;background:#9AA0B5;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.sd.ok i{background:#5FBF6A}.sd.wait i{background:var(--gold)}.sd.bad i{background:#E0574B}
.sd.busy i{animation:pu2 .8s infinite}@keyframes pu2{50%{opacity:.3}}
.setup .hello{font-size:22px;font-weight:800}
.stepn{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--grey);text-transform:uppercase;margin-bottom:2px}
.warnb{background:#f6dcd8;border-left:4px solid var(--red);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:center}
.srch{text-transform:uppercase;margin-bottom:12px;font-size:17px;font-weight:700;letter-spacing:1px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
.opt:active{border-color:var(--gold)}
.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--grey)}
.lys{display:inline-flex;align-items:center;gap:6px;padding:6px 10px}.lys svg{width:16px;height:16px}
.info .lys{border-color:var(--bd)}
.side .tb{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.side .tb button,.side .tb a{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:8px 10px;font-weight:700;font-size:13px;text-align:left;text-decoration:none;cursor:pointer}
.okb{color:var(--green);font-weight:700}.nob{color:var(--red);font-weight:700}
.upd{flex:none;display:none;align-items:center;gap:10px;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 12px}.upd.show{display:flex}.upd button{margin-left:auto;background:#fff;color:var(--green);border:0;border-radius:6px;padding:6px 12px;font-weight:800}
/* utskrift A4 */
#print{display:none}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{background:#fff!important;height:auto}
 .stage{display:none!important}
 #print{display:block}
 .pg{width:210mm;height:296mm;position:relative;page-break-after:always;break-after:page;overflow:hidden;background:#fff}
 .pg:last-child{page-break-after:auto;break-after:auto}
 .pg .qr{position:absolute;left:20mm;top:38mm;width:170mm;height:170mm}
 .pg .qr svg{width:100%;height:100%;display:block}
 .pg .ft{position:absolute;left:18mm;right:18mm;bottom:14mm;color:#333;font-family:Arial,sans-serif;border-top:.3mm solid #999;padding-top:3mm}
 .pg .f1{font-size:10pt;font-weight:700}
 .pg .f2{font-size:8.5pt;margin-top:1mm;line-height:1.35}
 .pg .f3{font-size:7pt;color:#777;margin-top:1.5mm}
}
/* v0.5 helskärm, även på PC */
body{background:var(--bg)}
.stage{display:block;padding:0;min-height:0}
.phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
.testbar{flex-wrap:wrap}
.testbar .sp{margin-left:auto}
.testbar button,.testbar a{background:var(--navy);color:var(--gold);border:0;border-radius:4px;padding:3px 8px;font-weight:800;font-size:11px;text-decoration:none;cursor:pointer;letter-spacing:.5px}
.sheet{justify-content:center}
@media (min-width:900px){
 .top{padding:0 24px}
 .nav{justify-content:center}.tab{flex:none;padding:14px 24px 11px}
 .scr{padding:22px max(20px,calc((100% - 600px)/2)) 30px}
 .scr.wide{padding:22px max(24px,calc((100% - 1240px)/2)) 30px}
 .dock{padding-left:max(14px,calc((100% - 600px)/2));padding-right:max(14px,calc((100% - 600px)/2))}
 .dlg{max-width:580px}
 .sh{max-width:560px}
 .res{padding:0 max(0px,calc((100% - 600px)/2))}
 .toast{left:calc(50% - 240px);right:calc(50% - 240px)}
 .admw{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
 .admw .sub2{flex-direction:column;flex-wrap:nowrap;position:sticky;top:0;gap:6px}
 .admw .sub2 button{text-align:left;padding:12px 14px;font-size:14px}
 .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start;margin-bottom:12px}
 .ugrid .card{margin:0}
}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const sp=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'–';
const pn=n=>n<0?'−'+Math.abs(n):n;
function fmt(ms){if(ms==null)return'–';const t=Math.max(0,Math.round(ms/100));const m=Math.floor(t/600),s=Math.floor(t/10)%60,d=t%10;return m+':'+pad(s)+','+d}

function tone(f,d,type='sine',v=.2,at=0,f2){const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}

/* ===== Server: låtsasserver i testläge, Cloudflare i skarp version =====
   Alla anrop skickar X-Hemtam = SHA-256("hemtam:"+delningskod). Servern kopplas till
   den första koden som skickar en bana och tar sedan bara emot samma kod. */
const SY={st:'',last:0,busy:false};
let syncT=0;
const online=()=>TEST?lsGet(K.wifi,true)!==false:navigator.onLine!==false;
const tokOf=kod=>sha('hemtam:'+kod);
async function api(method,path,body,kod){
 const tok=await tokOf(kod??KOD);
 if(TEST)return mockApi(method,path,body,tok);
 let r;try{r=await fetch(API+path,{method,headers:{'Content-Type':'application/json','X-Hemtam':tok},body:body?JSON.stringify(body):undefined,cache:'no-store'})}catch(e){return{status:0}}
 let data=null;try{data=await r.json()}catch(e){}
 return{status:r.status,data};
}
async function mockApi(method,path,body,tok){
 await new Promise(r=>setTimeout(r,200+Math.random()*250));
 if(!online())return{status:0};
 let m;try{m=JSON.parse(localStorage.getItem(K.mock)||'{}')}catch(e){m={}}
 m=Object.assign({tok:'',bana:null,res:[],fel:[],epoch:1,seq:0},m);
 const save=()=>{try{localStorage.setItem(K.mock,JSON.stringify(m))}catch(e){}};
 const auth=m.tok&&m.tok===tok;
 if(path==='/bana'&&method==='GET'){if(!m.tok||!m.bana)return{status:404};if(!auth)return{status:401};return{status:200,data:m.bana}}
 if(path==='/bana'&&method==='PUT'){if(!m.tok)m.tok=tok;else if(!auth)return{status:401};m.bana={andrad:body.andrad,data:body.data};save();return{status:200,data:{ok:true}}}
 if(!m.tok)return{status:404};
 if(!auth)return{status:401};
 if(path==='/sync'){
  const fresh=body.epoch!=null&&body.epoch!==m.epoch;
  if(!fresh){
   const ri=new Set(m.res.map(r=>r.id)),fi=new Set(m.fel.map(r=>r.id));
   for(const r of body.res||[])if(!ri.has(r.id))m.res.push(Object.assign({},r,{s:++m.seq}));
   for(const f of body.fel||[])if(!fi.has(f.id))m.fel.push(Object.assign({},f,{s:++m.seq}));
   save();
  }
  const since=fresh?0:(+body.since||0);
  return{status:200,data:{epoch:m.epoch,now:m.seq,full:since===0,res:m.res.filter(r=>r.s>since),fel:m.fel.filter(r=>r.s>since),andrad:m.bana&&m.bana.andrad}};
 }
 if(path==='/reset'){m.res=[];m.fel=[];m.epoch++;save();return{status:200,data:{epoch:m.epoch}}}
 if(path==='/rekey'){if(!/^[0-9a-f]{64}$/.test(body.ny||''))return{status:400};m.tok=body.ny;save();return{status:200,data:{ok:true}}}
 return{status:404};
}
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(sync,1200)}
async function sync(){
 if(!B||!KOD||SY.busy)return;
 if(!online()){SY.st='off';paintSync();return}
 SY.busy=true;paintSync();
 let changed=false;const st0=SY.st;
 try{
  if(DIRTY&&!WALLMODE){
   const r=await api('PUT','/bana',{andrad:B.andrad,data:await encrypt(JSON.stringify(B),KOD)});
   if(r.status===401){SY.st='nokod';return}
   if(r.status!==200)throw r.status;
   DIRTY=false;lsSet(K.dirty,false);
  }
  const sR=OUT.res.map(x=>x.id),sF=OUT.fel.map(x=>x.id);
  const r=await api('POST','/sync',{since:CACHE.since,epoch:CACHE.epoch,res:WALLMODE?[]:OUT.res,fel:WALLMODE?[]:OUT.fel});
  if(r.status===401){SY.st='nokod';return}
  if(r.status===404){SY.st='empty';return}
  if(r.status!==200)throw r.status;
  const d=r.data,reset=CACHE.epoch!=null&&d.epoch!==CACHE.epoch;
  if(reset||d.full){CACHE.res=[];CACHE.fel=[]}
  if(reset){OUT={res:[],fel:[]}}else{OUT.res=OUT.res.filter(x=>!sR.includes(x.id));OUT.fel=OUT.fel.filter(x=>!sF.includes(x.id))}
  if(d.res.length||d.fel.length||reset)changed=true;
  CACHE.res=merged(CACHE.res,d.res);CACHE.fel=merged(CACHE.fel,d.fel);
  CACHE.epoch=d.epoch;CACHE.since=d.now;saveCache();saveOut();
  if(reset&&SES)toast('Admin har nollställt alla resultat',3500);
  if(d.andrad&&(!B.andrad||d.andrad>B.andrad)&&!DIRTY){if(CUR)PENDING=true;else if(await pullBana())changed=true}
  SY.st='ok';SY.last=Date.now();
 }catch(e){SY.st=online()?'err':'off'}
 finally{SY.busy=false;paintSync();if(changed||(st0==='nokod')!==(SY.st==='nokod'))refresh()}
}
async function pullBana(){
 const r=await api('GET','/bana');if(r.status!==200)return false;
 let b=null;try{b=migrate(JSON.parse(await decrypt(r.data.data,KOD)))}catch(e){}
 if(!b)return false;
 B=b;lsSet(K.bana,B);PENDING=false;
 if(SES&&!userOf(SES.sig)){logout('Din användare finns inte längre i banan');return true}
 if(SES&&!WALLMODE)toast('Banan uppdaterad från servern');
 return true;
}

 const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;

function syncText(){

 if(SY.busy)return'Synkar med servern …';
 switch(SY.st){
  case'nokod':return'Delningskoden stämmer inte längre. '+(isAdmin()?'Slå den nya under Admin → Bana.':'Be admin om den nya koden.');
  case'off':return'Ingen kontakt med servern'+w+'. Allt skickas när telefonen har wifi.';

  default:return n?n+' resultat väntar på att skickas.':'Väntar på första synk.';
 }

/* ===== Framsteg – räknas fram ur resultaten så att det följer med mellan telefoner ===== */
function applyRes(p,r){
 for(const c of (r.pls||(r.pl?[r.pl]:[])))if(c&&!p.found[c])p.found[c]=r.t;
 if(r.typ==='fri'||!r.u)return;
 p.done[r.u]=(p.done[r.u]||0)+1;
 if(r.ms!=null&&(p.pb[r.u]==null||r.ms<p.pb[r.u]))p.pb[r.u]=r.ms;
 if(r.q===true)p.quiz++;if(r.typ==='larm')p.larm++;if(r.typ==='kedja')p.kedja++;if(r.pbx)p.pbHit++;
}
function progOf(sig){
 const u=userOf(sig)||{};
 const p={found:{},done:{},pb:{},quiz:0,larm:0,kedja:0,pbHit:0,lvlAll:{},unlock:+u.unlock||1};
 for(const r of allRes().filter(r=>r.sig===sig&&r.ok!==false).sort((a,b)=>a.t-b.t))applyRes(p,r);
 for(let n=1;n<=5;n++)if(lvlStat(p,n).all)p.lvlAll[n]=1;
 return p;
}

/* ===== Nivåer ===== */
function validU(u){
 if(u.typ==='kedja')return (u.kedja||[]).filter(PL).length>=2;
 if(u.typ==='tid')return !!(PL(u.mal)&&PL(u.start));
 return !!PL(u.mal);
}
const allU=()=>B.uppdrag.filter(validU);
const inLvl=n=>allU().filter(u=>u.niva===n);
function lvlStat(p,n){
 if(n===5){const a=allU(),d=a.filter(u=>(p.done[u.id]||0)>=2).length;return{tot:a.length,done:d,krav:a.length,clear:a.length>0&&d===a.length,all:a.length>0&&d===a.length,vikt:0,viktDone:0}}
 const a=inLvl(n),d=a.filter(u=>p.done[u.id]).length,v=a.filter(u=>u.viktig),vd=v.filter(u=>p.done[u.id]).length;
 const krav=Math.min(Math.max(1,+B.nivaer[n-1].krav||1),a.length);
 return{tot:a.length,done:d,krav,clear:a.length>0&&d>=krav&&vd===v.length,all:a.length>0&&d===a.length,vikt:v.length,viktDone:vd};
}
function unlocked(p){
 let c=1;while(c<5&&lvlStat(p,c).clear)c++;
 let u=Math.max(c,Math.min(5,+p.unlock||1));while(u<5&&lvlStat(p,u).clear)u++;
 return u;
}
const selLvl=(p,sig)=>{const t=unlocked(p);return Math.min(Math.max(1,+SEL[sig]||t),t)};

/* ===== Märken ===== */
const BADGES=[
 {id:'forsta',ic:'✓',n:'Första stämpeln',d:'Stämpla in på en plats'},
 {id:'upptack',ic:'◎',n:'Upptäckaren',d:'Hitta 3 platser'},
 {id:'karta',ic:'⌂',n:'Husets karta',d:'Hitta alla platser'},
 {id:'pb',ic:'↑',n:'Personbästa',d:'Slå ditt eget rekord'},
 {id:'fullt',ic:'▣',n:'Fullt hus',d:'Alla uppdrag i en nivå'},
 {id:'expert',ic:'◆',n:'Experten',d:'Lås upp nivå 5'},
 {id:'insats',ic:'!',n:'Första insatsen',d:'Svara på ett larm'},
 {id:'insats5',ic:'‼',n:'Insatsvan',d:'Svara på 5 larm'},
 {id:'kedja',ic:'⛓',n:'Kedjan',d:'Klara en kedja'},
 {id:'kunnig',ic:'?',n:'Kunnig',d:'3 rätta svar på plats'},
 {id:'rad3',ic:'3',n:'Tre i rad',d:'Spela tre dagar i rad'},
 {id:'pall',ic:'★',n:'Pallplats',d:'Topp 3 en hel dag'},
 {id:'guld',ic:'1',n:'Dagens etta',d:'Vinn en dag'}
];
function dayTotals(d){const m={};for(const r of allRes())if(r.d===d&&r.typ!=='fri')m[r.sig]=(m[r.sig]||0)+r.p;return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function rangeTotals(from){const m={};for(const r of allRes())if(r.d>=from&&r.typ!=='fri')m[r.sig]=(m[r.sig]||0)+r.p;return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function medals(sig){const days=[...new Set(allRes().map(r=>r.d))].filter(d=>d<today());const c=[0,0,0];for(const d of days){dayTotals(d).slice(0,3).forEach(([x],i)=>{if(x===sig)c[i]++})}return c}
function streak(sig){const ds=new Set(allRes().filter(r=>r.sig===sig).map(r=>r.d));let n=0,d=today();if(!ds.has(d))d=addDays(d,-1);while(ds.has(d)){n++;d=addDays(d,-1)}return n}
function badgeSet(sig){
 const p=progOf(sig),s=new Set(),f=Object.keys(p.found).filter(c=>PL(c)).length;
 if(f>=1)s.add('forsta');if(f>=3)s.add('upptack');if(B.platser.length&&f>=B.platser.length)s.add('karta');
 if(p.pbHit)s.add('pb');if(Object.keys(p.lvlAll).length)s.add('fullt');if(unlocked(p)>=5)s.add('expert');
 if(p.larm>=1)s.add('insats');if(p.larm>=5)s.add('insats5');if(p.kedja)s.add('kedja');if(p.quiz>=3)s.add('kunnig');
 if(streak(sig)>=3)s.add('rad3');
 const m=medals(sig);if(m[0]+m[1]+m[2])s.add('pall');if(m[0])s.add('guld');
 return s;
}

/* ===== Uppdrag ===== */
function drawMission(){
 const p=progOf(SES.sig),L=selLvl(p,SES.sig);
 const base=L===5?allU():inLvl(L);
 if(!base.length){toast(L===5?'Banan har inga uppdrag ännu':'Nivån har inga uppdrag ännu',3000);return}
 const here=SES.here||'';
 const ok=u=>u.typ!=='tid'||u.start===here;
 let pick;
 if(L<5){
  const nd=base.filter(u=>!p.done[u.id]);
  if(nd.length){const vk=nd.filter(u=>u.viktig&&ok(u));pick=vk.length?vk:nd.filter(ok)}
  else{pick=base.filter(u=>ok(u)&&u.id!==SES.last);if(!pick.length)pick=base.filter(ok)}
 }else{pick=base.filter(u=>ok(u)&&u.id!==SES.last);if(!pick.length)pick=base.filter(ok)}
 if(!pick.length){
  const st=[...new Set(base.filter(u=>u.typ==='tid').map(u=>plName(u.start)))];
  toast('Uppdragen som är kvar startar på en annan plats. Gå dit och skanna: '+st.join(', '),5000);return;
 }
 startMission(pick[Math.floor(Math.random()*pick.length)],L);
}
function startMission(u,L){
 const timed=u.typ==='tid'||u.typ==='larm';
 hush();
 CUR={u:u.id,t0:timed?Date.now():0,idx:0,pen:0,hint:false,fel:0,ring:u.typ==='larm',lvl:L,phase:'go',pls:[]};
 if(u.typ==='larm')alarmOn();else if(u.typ==='tid')SND.start();else SND.click();
 SES.last=u.id;touch();
 armSurprise();
 VIEW='hem';render();
}
let surpT=0;
function armSurprise(){
 clearTimeout(surpT);
 if(!B.overraskning||!CUR||CUR.lvl<3)return;
 const u=UP(CUR.u);if(!u||u.typ==='larm')return;
 const larm=allU().filter(x=>x.typ==='larm');if(!larm.length)return;
 surpT=setTimeout(()=>{if(!CUR||!SES||UP(CUR.u).typ==='larm'||CUR.phase==='quiz')return;closeSheet();toast('Uppdraget avbröts – LARM!',3000,'bad');startMission(larm[Math.floor(Math.random()*larm.length)],CUR.lvl)},(25+Math.random()*50)*1000);
}
function afterMission(){CUR=null;if(PENDING)pullBana()}
function abortMission(){confirmBox('Avbryt uppdraget',`Uppdraget räknas som misslyckat och ger <b>${P_AVB} p</b>.`,'Avbryt uppdraget',()=>{
 const u=UP(CUR.u),pts=P_AVB+P_FEL*CUR.fel;
 alarmOff();hush();clearTimeout(surpT);hideZoom();
 addRes({id:uid(),sig:SES.sig,u:u.id,typ:u.typ,ms:null,p:pts,d:today(),t:Date.now(),pl:'',ok:false,ab:true,f:CUR.fel,niva:CUR.lvl});
 afterMission();SND.bad();render();toast('Uppdraget avbrutet: '+sp(pts)+' p',3000,'bad');
})}
function tysta(){if(!CUR||!CUR.ring)return;alarmOff();CUR.ring=false;SND.click();vib(40);render()}
function larmHint(){
 if(!CUR||UP(CUR.u).typ!=='larm'||CUR.hint)return;
 CUR.hint=true;CUR.pen+=PEN_HINT;SND.click();render();toast('Ledtråd: +15 sekunder på tiden');
}

/* ===== Zoom på larmdisplayen ===== */
let zoomT=0,zoomOn=false;
function lcdData(){const u=CUR&&UP(CUR.u);if(!u||u.typ!=='larm')return null;const n=new Date();return{u,date:today(),time:pad(n.getHours())+':'+pad(n.getMinutes())}}
function showZoom(){
 const d=lcdData();if(!d)return;zoomOn=true;vib(30);
 $('#zoom').innerHTML=`<div class="zlcd"><div class="zl"><span>${d.date}</span><span>${d.time}</span></div><div class="zt">LARM</div><div class="za">${esc(d.u.larm.adress||'')}</div>${d.u.larm.nummer?`<div class="zn">${esc(d.u.larm.nummer)}</div>`:''}<div class="zc"><span data-t></span></div></div><div class="zh">Släpp fingret för att stänga</div>`;
 $('#zoom').classList.add('show');tickT();
}
function hideZoom(){clearTimeout(zoomT);zoomT=0;if(!zoomOn)return;zoomOn=false;$('#zoom').classList.remove('show');$('#zoom').innerHTML=''}
function wireZoom(){
 const dev=$('#dev');if(!dev)return;
 dev.oncontextmenu=e=>e.preventDefault();
 dev.addEventListener('pointerdown',e=>{try{dev.setPointerCapture(e.pointerId)}catch(x){}clearTimeout(zoomT);zoomT=setTimeout(showZoom,280)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dev.addEventListener(ev,hideZoom));
}

/* ===== Skanna (BarcodeDetector på Android, jsQR på iPhone) ===== */
let camStream=null,camLoop=0;
function openScan(){
 const sh=$('#sheet');
 const codes=B?B.platser:[];
 sh.innerHTML=`<div class="sh"><div class="row"><b style="letter-spacing:1.5px">SKANNA QR-KOD</b><button class="btn sm ml" id="scX">Stäng</button></div>
 <div id="camBox"></div>
 ${TEST?`<div class="st" style="margin-top:4px"><b>Testläge:</b> tryck på en kod för att låtsas skanna den.</div>
 <div class="codes">${codes.map(p=>`<button data-c="${esc(p.id)}">${esc(p.id)}<small>${esc(p.namn)}</small></button>`).join('')}<button data-c="X-99">X-99<small>okänd kod</small></button></div>`:''}</div>`;
 sh.classList.add('show');
 $('#scX').onclick=closeSheet;
 sh.onclick=e=>{if(e.target===sh)closeSheet()};
 sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{closeSheet();onScan(b.dataset.c)});
 startCam();
}
async function startCam(){
 const box=$('#camBox');
 const hasBD='BarcodeDetector' in window,hasJ=typeof jsQR==='function';
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||(!hasBD&&!hasJ)){box.innerHTML='<div class="camoff">Kameran går inte att använda i den här webbläsaren.</div>';return}
 try{
  let det=null;if(hasBD){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  box.innerHTML='<div class="cam"><video id="vid" playsinline muted autoplay></video><div class="fr"></div></div>';
  const v=$('#vid');v.srcObject=camStream;await v.play();
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  let busy=false;
  camLoop=setInterval(async()=>{
   if(busy||!v.videoWidth)return;busy=true;
   try{
    let c=null;
    if(det){const r=await det.detect(v);if(r&&r[0])c=r[0].rawValue}
    else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const q=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(q&&q.data)c=q.data}
    if(c){closeSheet();onScan(c)}
   }catch(e){}
   busy=false;
  },200);
 }catch(e){box.innerHTML='<div class="camoff">Kameran är inte tillgänglig. Kontrollera att appen får använda kameran.</div>'}
}
function closeSheet(){clearInterval(camLoop);camLoop=0;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const s=$('#sheet');s.classList.remove('show');s.innerHTML=''}
function onScan(raw){
 touch();
 const code=String(raw||'').trim().toUpperCase().replace(/^HEMTAM:/,'');
 const pl=PL(code);
 if(!pl){SND.bad();vib(200);toast('Okänd QR-kod ('+code+')',2600,'bad');return}
 if(!CUR){freeStamp(pl);return}
 if(CUR.phase==='quiz')return;
 const u=UP(CUR.u);
 const ch=u.typ==='kedja'?u.kedja.filter(PL):null;
 const target=ch?ch[CUR.idx]:u.mal;
 if(code!==target){wrongScan(pl,u,ch&&ch.includes(code));return}
 if(CUR.ring){alarmOff();CUR.ring=false}
 SND.stamp();vib(80);
 CUR.pls.push(code);SES.here=code;touch();
 if(ch&&CUR.idx<ch.length-1){CUR.idx++;render();toast('Rätt! Nästa: '+plName(ch[CUR.idx]),2600,'good');return}
 if(u.typ==='fraga'&&u.fraga&&u.fraga.q){CUR.phase='quiz';CUR.tEnd=Date.now();clearTimeout(surpT);render();return}
 finish(null);
}
function wrongScan(pl,u,order){
 CUR.fel++;SND.bad();vib([120,60,120]);
 addFel({id:uid(),sig:SES.sig,u:u.id,pl:pl.id,d:today(),t:Date.now()});
 toast((order?'Fel ordning':'Fel plats')+' – det här är '+pl.namn+'. Leta vidare efter rätt plats! '+P_FEL+' p',3400,'bad');
 render();
}
function freeStamp(pl){
 SND.stamp();vib(80);
 const isNew=!progOf(SES.sig).found[pl.id],bb=badgeSet(SES.sig);
 SES.here=pl.id;touch();
 addRes({id:uid(),sig:SES.sig,u:'',typ:'fri',ms:null,p:0,d:today(),t:Date.now(),pl:pl.id,pls:[pl.id],ok:true,f:0});
 const got=[...badgeSet(SES.sig)].filter(x=>!bb.has(x));
 showResult({title:isNew?'NY PLATS!':'INSTÄMPLAD',place:pl,ms:null,lines:[],total:null,got,info:'',ribbons:[]});
}

/* ===== Avsluta uppdrag ===== */
function finish(quizOk){
 clearTimeout(surpT);alarmOff();hideZoom();
 const u=UP(CUR.u),sig=SES.sig,p=progOf(sig),lines=[],ribbons=[];
 const timed=u.typ==='tid'||u.typ==='larm';
 const ms=timed?((CUR.tEnd||Date.now())-CUR.t0+CUR.pen):null;
 const before=unlocked(p),bb=badgeSet(sig);
 const target=u.typ==='kedja'?u.kedja.filter(PL).slice(-1)[0]:u.mal;
 const r={id:uid(),sig,u:u.id,typ:u.typ,ms,p:0,d:today(),t:Date.now(),pl:target,pls:CUR.pls.length?CUR.pls:[target],ok:true,f:CUR.fel,q:quizOk,niva:CUR.lvl};
 lines.push([u.typ==='kedja'?'Kedjan klar':u.typ==='larm'?'Insats klar':'Uppdrag klart',P_OK]);
 if(CUR.fel)lines.push([CUR.fel+(CUR.fel>1?' felskanningar':' felskanning'),P_FEL*CUR.fel]);
 if(CUR.hint)lines.push(['Ledtråd (+15 s på tiden)',0]);
 if(quizOk===true)lines.push(['Rätt svar på frågan',0]);
 if(quizOk===false)lines.push(['Fel svar på frågan',0]);
 if(timed&&p.pb[u.id]!=null&&ms<p.pb[u.id]){r.pbx=true;lines.push(['Nytt personligt rekord!!',P_PB]);ribbons.push('NYTT PERSONLIGT REKORD!!')}
 const q=clone(p);applyRes(q,r);
 const after=unlocked(q);
 for(let n=before+1;n<=after;n++){lines.push(['Nivå '+n+' upplåst – '+nvName(n),P_NIVA]);ribbons.push('NIVÅ '+n+' UPPLÅST')}
 for(let n=1;n<=5;n++)if(!p.lvlAll[n]&&lvlStat(q,n).all){lines.push([n===5?'Expertnivån klar – allt två gånger!':'Alla uppdrag i '+nvName(n)+' klara',P_ALLA]);ribbons.push(n===5?'EXPERTNIVÅN KLAR':'NIVÅ '+n+' FULLT HUS')}
 if(after>before)setSel(sig,after);
 r.p=lines.reduce((a,l)=>a+l[1],0);
 const rec0=timed?bestOf(u.id):null,isRec=timed&&(!rec0||ms<rec0.ms);
 addRes(r);
 if(isRec)ribbons.unshift('NYTT BANREKORD');
 const got=[...badgeSet(sig)].filter(x=>!bb.has(x));
 afterMission();
 showResult({title:u.typ==='larm'?'INSATS KLAR':'RÄTT PLATS!',place:PL(target),ms,lines,total:r.p,got,info:u.info,ribbons,rec:isRec});
 (ribbons.length||got.length)?SND.fan():SND.ok();
}
function bestOf(uId){let b=null;for(const r of allRes())if(r.u===uId&&r.ok!==false&&r.ms!=null&&(!b||r.ms<b.ms))b=r;return b}
function showResult(o){
 const el=$('#res');
 const sayTxt=[o.place?o.place.namn+'.':'',o.place?o.place.info:'',o.info?'Vid uppdraget: '+o.info:''].join(' ');
 el.innerHTML=`<div class="hd"><div class="ck">${ICON.check}</div><h2>${esc(o.title)}</h2><div class="pl">${esc(o.place?o.place.namn:'')}</div>
  ${o.ms!=null?`<div class="bigt">${fmt(o.ms)}</div>`:''}
  ${o.ribbons.map((r,i)=>`<div class="ribbon">${esc(r)}${o.rec&&i===0?' '+ICON.crown:''}</div>`).join('<br>')}</div>
  ${o.lines.length?`<div class="pts">${o.lines.map(l=>`<div><span>${esc(l[0])}</span><span>${sp(l[1])}</span></div>`).join('')}<div><span>Poäng</span><span>${pn(o.total)}</span></div></div>`:''}
  ${o.got.length?`<div style="text-align:center;margin-top:16px;font-weight:800;letter-spacing:2px;font-size:12px;color:var(--gold)">NYTT MÄRKE</div><div class="newb">${o.got.map(id=>badgeHtml(BADGES.find(b=>b.id===id),true)).join('')}</div>`:''}
  ${(o.place&&o.place.info)||o.info?`<div class="info"><div class="row"><small>${esc((o.place?o.place.namn:'').toUpperCase())}</small><span class="ml">${lysBtn('res')}</span></div><p>${esc(o.place?o.place.info:'')}</p>${o.info?`<p style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><b>Vid uppdraget:</b> ${esc(o.info)}</p>`:''}</div>`:''}
  <div class="acts"><button class="btn gold wide" id="rNext" style="font-size:16px;padding:15px">NÄSTA UPPDRAG</button><button class="btn wide" id="rHome" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Till start</button></div>`;
 el.classList.add('show');el.scrollTop=0;
 const sb=el.querySelector('[data-say]');if(sb)sb.onclick=()=>speak(sayTxt);
 $('#rNext').onclick=()=>{hush();el.classList.remove('show');drawMission()};
 $('#rHome').onclick=()=>{hush();el.classList.remove('show');VIEW='hem';render()};
}

async function hamta(kod,err){
 if(!online())return err('Ingen kontakt med servern. Anslut telefonen till wifi i utbildningslokalen.');

 if(r.status===401)return err('Fel delningskod.');

 if(r.status!==200)return err('Servern svarar inte just nu. Försök igen.');
 let b=null;try{b=migrate(JSON.parse(await decrypt(r.data.data,kod)))}catch(e){}
 if(!b)return err('Banan kunde inte låsas upp.');
 B=b;KOD=kod;lsSet(K.bana,B);lsSet(K.kod,KOD);DIRTY=false;lsSet(K.dirty,false);freshResults();
 SETUP={step:'val'};render();toast('Banan hämtad – logga in',3000);sync();
}
async function finishSetup(b,demo){
 const a={sig:SETUP.sig,salt:SETUP.salt,hash:SETUP.hash,admin:true};
 b.users=(b.users||[]).filter(u=>u.sig!==a.sig);b.users.unshift(a);
 if(demo)for(const [sig,pin] of [['ANNA','1111'],['OLLE','2222'],['LISA','3333']])if(!b.users.some(u=>u.sig===sig)){const sl=salt();b.users.push({sig,salt:sl,hash:await sha(sl+pin),admin:false})}
 B=migrate(b);KOD=SETUP.kod;lsSet(K.kod,KOD);freshResults();SEL={};lsSet(K.sel,SEL);
 saveBana();
 const sig=a.sig;SETUP={step:'val'};login(sig);
 toast('Klart! Banan skickas till servern när telefonen har wifi.',4000);
}

/* ===== Storskärm =====
   I telefonen: Admin → Bana → Starta storskärm.
   På en dator: appens adress + ?storskarm. Kräver delningskod och admin-PIN. Inget sparas på datorn. */
const WALL={ok:false};
let wallT=0;
function vWallLogin(){
 $('#view').innerHTML=`<div style="max-width:420px;margin:30px auto"><div class="card"><div class="h">Storskärm – logga in</div><div class="pad">
 <div class="st">Inget sparas på den här datorn. Stäng fliken när ni är klara.</div>
 <label class="lbl">Delningskod</label><input class="fi" id="wK" type="password" autocomplete="off">
 <label class="lbl">Admin-signatur</label><input class="fi" id="wS" autocomplete="off" style="text-transform:uppercase;font-weight:800;letter-spacing:2px">
 <label class="lbl">PIN</label><input class="fi" id="wP" type="password" inputmode="numeric" autocomplete="off">
 <div class="err" id="wE" style="margin-top:8px"></div><button class="btn navy wide" id="wGo" style="margin-top:6px">Visa storskärm</button></div></div></div>`;
 const e=t=>$('#wE').textContent=t;
 $('#wGo').onclick=async()=>{
  const k=$('#wK').value,s=$('#wS').value.trim().toUpperCase(),p=$('#wP').value;
  if(!online())return e('Ingen kontakt med servern.');
  const r=await api('GET','/bana',null,k);
  if(r.status===401)return e('Fel delningskod.');if(r.status===404)return e('Servern har ingen bana ännu.');if(r.status!==200)return e('Servern svarar inte just nu.');
  let b=null;try{b=migrate(JSON.parse(await decrypt(r.data.data,k)))}catch(x){}
  if(!b)return e('Banan kunde inte låsas upp.');
  const u=b.users.find(x=>x.sig===s);
  if(!u||!u.admin||(await sha(u.salt+p))!==u.hash)return e('Fel signatur eller PIN – storskärmen kräver en admin.');
  B=b;KOD=k;CACHE={res:[],fel:[],epoch:null,since:0};OUT={res:[],fel:[]};WALL.ok=true;
  await sync();render();
 };
}
function vWall(){
 const td=dayTotals(today()),feed=allRes().filter(r=>r.d===today()).sort((a,b)=>b.t-a.t).slice(0,7);
 $('#view').innerHTML=`<div class="row" style="margin-bottom:18px"><div style="font-size:15px;letter-spacing:3px;font-weight:800;color:var(--grey)">${esc((B.namn||'').toUpperCase())} · ${today()}</div><span class="st ml" id="srvTxt">${esc(syncText())}</span><button class="btn sm" id="wX">${WALLMODE?'Logga ut':'Stäng storskärm'}</button></div>
 <div class="wall"><div><h2>DAGENS TOPPLISTA</h2><div class="card">${td.length?`<table class="lb">${td.slice(0,8).map((r,i)=>`<tr><td class="n">${i<3?`<span class="med m${i+1}">${i+1}</span>`:i+1}</td><td class="s">${esc(r[0])}</td><td class="v">${pn(r[1])} p</td></tr>`).join('')}</table>`:'<div class="empty">Ingen har spelat i dag ännu.</div>'}</div></div>
 <div><h2>SENASTE</h2><div class="feed">${feed.map(r=>{const u=UP(r.u);return `<div><b>${esc(r.sig)}</b><span>${r.typ==='fri'?'Instämpling '+esc(plName(r.pl)):esc(u?uName(u):'Uppdrag')}${r.ok===false?' – avbrutet':''}</span><span class="tm">${r.ms!=null?fmt(r.ms):sp(r.p)+' p'}</span></div>`}).join('')||'<div class="empty" style="background:none;box-shadow:none">–</div>'}</div></div></div>`;
 $('#wX').onclick=()=>{clearInterval(wallT);if(WALLMODE){WALL.ok=false;B=null;KOD='';CACHE={res:[],fel:[],epoch:null,since:0};render()}else{document.body.classList.remove('big');render()}};
 clearInterval(wallT);wallT=setInterval(()=>{if(document.body.classList.contains('big')&&B&&(!WALLMODE||WALL.ok))vWall();else clearInterval(wallT)},3000);
}

function editUppdrag(id){
 const src=id?clone(UP(id)):{id:'U'+uid().slice(-6),niva:1,viktig:false,typ:'hitta',titel:'',text:'',mal:B.platser[0]&&B.platser[0].id,info:''};
 const form=()=>{const u=src,t=u.typ;
  $('#dlg').innerHTML=`<h3>${id?'Ändra uppdrag':'Nytt uppdrag'}</h3>
  <div class="row"><div style="flex:1"><label class="lbl">Nivå</label><select class="fi" id="uNv">${[1,2,3,4,5].map(n=>`<option value="${n}"${n===u.niva?' selected':''}>${n} · ${esc(nvName(n))}</option>`).join('')}</select></div>
  <div style="flex:1"><label class="lbl">Typ</label><select class="fi" id="uT">${Object.entries(TYP).map(([k,n])=>`<option value="${k}"${k===t?' selected':''}>${n}</option>`).join('')}</select></div></div>
  <label class="tg" style="margin-top:12px"><input type="checkbox" id="uVk"${u.viktig?' checked':''}><span><b>★ Viktigt uppdrag</b><br><span class="st">Lottas först och måste klaras för att nivån ska bli klar.</span></span></label>
  ${t==='larm'?`<label class="lbl">Larmadress (visas på displayen)</label><input class="fi" id="uLA" value="${esc(u.larm&&u.larm.adress||'')}" placeholder="t.ex. E1:05 KORRIDOR" style="font-family:monospace;font-weight:700">
   <label class="lbl">Larmnummer (valfritt)</label><input class="fi" id="uLN" value="${esc(u.larm&&u.larm.nummer||'')}" inputmode="numeric">
   <label class="lbl">Målplats – QR-koden som stoppar klockan</label>${plSel('uM',u.mal)}
   <label class="lbl">Ledtråd (valfri, +15 s)</label><input class="fi" id="uLL" value="${esc(u.larm&&u.larm.ledtrad||'')}">`
  :`<label class="lbl">Rubrik</label><input class="fi" id="uTi" value="${esc(u.titel||'')}">
   <label class="lbl">Uppdragstext</label><textarea class="fi" id="uTx" rows="3">${esc(u.text||'')}</textarea>
   ${t==='tid'?`<label class="lbl">Startpunkt</label>${plSel('uS',u.start)}<div class="st" style="margin-top:4px">Uppdraget lottas bara när förra uppdraget slutade här, så att alla springer samma sträcka. Klockan startar när uppdraget visas.</div>`:''}
   ${t==='kedja'?[0,1,2,3,4].map(i=>`<label class="lbl">Plats ${i+1}${i>1?' (valfri)':''}</label>${plSel('uK'+i,(u.kedja||[])[i],i>1)}`).join(''):`<label class="lbl">${t==='tid'?'Mål':'Målplats'}</label>${plSel('uM',u.mal)}`}
   ${t==='fraga'?`<label class="lbl">Fråga på plats</label><input class="fi" id="uQ" value="${esc(u.fraga&&u.fraga.q||'')}">${[0,1,2].map(i=>`<label class="lbl">Svar ${i+1}</label><div class="row"><input class="fi" id="uA${i}" value="${esc(u.fraga&&u.fraga.alt[i]||'')}"><label class="row st" style="white-space:nowrap"><input type="radio" name="uR" value="${i}"${(u.fraga?u.fraga.ratt:0)===i?' checked':''}> rätt</label></div>`).join('')}`:''}`}
  <label class="lbl">Extra info efter instämpling (valfri)</label><textarea class="fi" id="uI" rows="2">${esc(u.info||'')}</textarea>
  <div class="acts">${id?'<button class="btn red l" id="uDel">Ta bort</button>':''}<button class="btn" id="mC">Avbryt</button><button class="btn navy" id="uSv">Spara</button></div>`;
  $('#uT').onchange=()=>{read();src.typ=$('#uT').value;form()};
  $('#mC').onclick=closeModal;
  $('#uSv').onclick=save;
  const d=$('#uDel');if(d)d.onclick=()=>confirmBox('Ta bort uppdrag','Ta bort uppdraget? Resultat på topplistan finns kvar.','Ta bort',()=>{B.uppdrag=B.uppdrag.filter(x=>x.id!==id);saveBana();vAdm()});
 };
 const v=i=>{const e=$('#'+i);return e?e.value.trim():undefined};
 const read=()=>{const u=src;
  u.niva=+v('uNv')||1;u.viktig=$('#uVk').checked;
  if($('#uLA'))u.larm={adress:v('uLA').toUpperCase(),nummer:v('uLN'),ledtrad:v('uLL')};
  if($('#uTi')){u.titel=v('uTi');u.text=v('uTx')}
  if($('#uM'))u.mal=v('uM');if($('#uS'))u.start=v('uS');
  if($('#uK0'))u.kedja=[0,1,2,3,4].map(i=>v('uK'+i)).filter(Boolean);
  if($('#uQ'))u.fraga={q:v('uQ'),alt:[0,1,2].map(i=>v('uA'+i)),ratt:+((document.querySelector('input[name="uR"]:checked')||{}).value||0)};
  u.info=v('uI')||'';
 };
 const save=()=>{read();const u=src;
  if(u.typ==='larm'&&!(u.larm&&u.larm.adress)){toast('Skriv en larmadress');return}
  if(u.typ!=='larm'&&!u.titel){toast('Skriv en rubrik');return}
  if(u.typ==='kedja'&&u.kedja.length<2){toast('En kedja behöver minst två platser');return}
  if(u.typ==='fraga'&&(!u.fraga.q||!u.fraga.alt[u.fraga.ratt])){toast('Skriv fråga och rätt svar');return}
  if(u.typ==='tid'&&u.start===u.mal){toast('Start och mål måste vara olika');return}
  if(u.typ!=='larm')delete u.larm;if(u.typ!=='fraga')delete u.fraga;if(u.typ!=='kedja')delete u.kedja;if(u.typ!=='tid')delete u.start;
  if(id){const i=B.uppdrag.findIndex(x=>x.id===id);B.uppdrag[i]=u}else B.uppdrag.push(u);
  saveBana();closeModal();vAdm();toast('Uppdraget sparat')};
 openModal('');form();
}

function userDlg(sig){
 openModal(`<h3>${sig?'Ny PIN – '+esc(sig):'Ny användare'}</h3>
 ${sig?'':'<label class="lbl">Signatur (2–6 tecken)</label><input class="fi" id="nS" autocomplete="off" style="text-transform:uppercase;font-weight:800;letter-spacing:2px" maxlength="6">'}
 <label class="lbl">PIN (4–6 siffror)</label><input class="fi" id="nP" type="password" inputmode="numeric" autocomplete="new-password">
 <label class="lbl">Upprepa PIN</label><input class="fi" id="nP2" type="password" inputmode="numeric" autocomplete="new-password">
 ${sig?'':'<label class="tg" style="margin-top:12px"><input type="checkbox" id="nA"> Admin – kan ändra bana, uppdrag och användare</label>'}
 <div class="err" id="nE"></div><div class="acts"><button class="btn" id="mC">Avbryt</button><button class="btn navy" id="nSv">Spara</button></div>`);
 $('#mC').onclick=closeModal;
 $('#nSv').onclick=async()=>{const e=t=>$('#nE').textContent=t;
  const s=sig||$('#nS').value.trim().toUpperCase().replace(/\s/g,'');
  if(!sig&&!/^[A-ZÅÄÖ0-9]{2,6}$/.test(s))return e('Signaturen ska vara 2–6 bokstäver eller siffror');
  if(!sig&&userOf(s))return e('Signaturen finns redan');
  const p=$('#nP').value;if(!/^\d{4,6}$/.test(p))return e('PIN ska vara 4–6 siffror');if(p!==$('#nP2').value)return e('PIN-koderna stämmer inte');
  const sl=salt(),h=await sha(sl+p);

/* ===== Statistik ===== */
function median(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function admStat(){
 const res=allRes(),fel=allFel(),us=USERS(),pr={};for(const u of us)pr[u.sig]=progOf(u.sig);
 const found=id=>us.filter(u=>pr[u.sig].found[id]).length;
 const plR=B.platser.map(p=>({p,f:found(p.id),st:res.filter(r=>r.pl===p.id&&r.ok!==false).length,fel:fel.filter(x=>x.pl===p.id).length})).sort((a,b)=>a.f-b.f||a.st-b.st);
 const uR=B.uppdrag.map(u=>{const r=res.filter(x=>x.u===u.id),ok=r.filter(x=>x.ok!==false),t=ok.filter(x=>x.ms!=null).map(x=>x.ms),q=ok.filter(x=>x.q!=null);
  return{u,ok:ok.length,ab:r.filter(x=>x.ok===false).length,fel:fel.filter(x=>x.u===u.id).length,best:t.length?Math.min(...t):null,med:median(t),q:q.length?Math.round(100*q.filter(x=>x.q).length/q.length):null}}).sort((a,b)=>a.u.niva-b.u.niva);
 const usR=us.map(u=>{const p=pr[u.sig],r=res.filter(x=>x.sig===u.sig);return{sig:u.sig,n:unlocked(p),pl:Object.keys(p.found).filter(c=>PL(c)).length,ok:r.filter(x=>x.ok!==false&&x.typ!=='fri').length,ab:r.filter(x=>x.ok===false).length,fel:fel.filter(x=>x.sig===u.sig).length,last:r.length?Math.max(...r.map(x=>x.t)):null}}).sort((a,b)=>a.sig.localeCompare(b.sig,'sv'));
 const nU=us.length;
 const dt=t=>{if(!t)return'–';const d=new Date(t);return iso(d)===today()?'i dag '+hm(t):iso(d).slice(5)};
 $('#admB').innerHTML=`<div class="stats"><div class="stat"><b>${res.filter(r=>r.ok!==false&&r.typ!=='fri').length}</b><span>Klarade</span></div><div class="stat"><b>${res.filter(r=>r.ok===false).length}</b><span>Avbrutna</span></div><div class="stat"><b>${fel.length}</b><span>Felskann.</span></div></div>
 <div class="st" style="margin:-4px 0 10px">${esc(syncText())} Statistiken visar det som synkats till den här telefonen.</div>
 <div class="card"><div class="h">Platser<small>minst hittade överst</small></div><div class="tw"><table class="stt"><tr><th>Plats</th><th>Hittad</th><th>Stämpl</th><th>Fel*</th></tr>${plR.map(x=>`<tr${x.f===0?' class="warn"':''}><td><b>${esc(x.p.id)}</b> ${esc(x.p.namn)}</td><td>${x.f}/${nU}</td><td>${x.st}</td><td>${x.fel}</td></tr>`).join('')}</table></div><div class="st" style="padding:8px 14px 12px">* Fel = antal gånger någon skannat platsen när de skulle till en annan.</div></div>
 <div class="card"><div class="h">Uppdrag</div><div class="tw"><table class="stt"><tr><th>Uppdrag</th><th>Klar</th><th>Avbr</th><th>Fel</th><th>Bäst / median</th></tr>${uR.map(x=>`<tr${x.ab>x.ok||x.fel>x.ok*2&&x.fel>1?' class="warn"':''}><td><span class="st">N${x.u.niva}</span> ${x.u.viktig?'★ ':''}${esc(uName(x.u))}${x.q!=null?`<span class="st" style="display:block">${x.q} % rätt svar</span>`:''}</td><td>${x.ok}</td><td>${x.ab}</td><td>${x.fel}</td><td>${x.best!=null?fmt(x.best)+' / '+fmt(x.med):'–'}</td></tr>`).join('')}</table></div></div>
 <div class="card"><div class="h">Användare</div><div class="tw"><table class="stt"><tr><th>Sig</th><th>Nivå</th><th>Platser</th><th>Klar</th><th>Avbr</th><th>Fel</th><th>Senast</th></tr>${usR.map(x=>`<tr><td><b>${esc(x.sig)}</b></td><td>${x.n}</td><td>${x.pl}/${B.platser.length}</td><td>${x.ok}</td><td>${x.ab}</td><td>${x.fel}</td><td>${dt(x.last)}</td></tr>`).join('')}</table></div></div>`;

/* ===== QR-utskrift (A4-anslag) ===== */
function qrSvg(text){
 const q=qrcode(0,'M');q.addData(text);q.make();
 const n=q.getModuleCount(),m=4,sz=n+2*m;let d='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sz} ${sz}" shape-rendering="crispEdges"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function placeUses(id){
 const out=[];
 for(const u of B.uppdrag.slice().sort((a,b)=>a.niva-b.niva)){
  let role=null;
  if(u.typ==='kedja'){const i=(u.kedja||[]).indexOf(id);if(i>=0)role=' (kedja plats '+(i+1)+')'}
  else if(u.typ==='tid'){if(u.start===id)role=' (start)';else if(u.mal===id)role=' (mål)'}
  else if(u.mal===id)role='';
  if(role!=null)out.push(`Nivå ${u.niva}: ${uName(u)}${role}`);
 }
 return out;
}
function printDlg(){
 if(!B.platser.length){toast('Det finns inga platser');return}
 openModal(`<h3>Skriv ut QR-anslag</h3><div class="st">Ett A4-anslag per plats. Välj vilka som ska skrivas ut.</div>
 <div class="row" style="margin:10px 0"><button class="btn sm" id="prA">Alla</button><button class="btn sm" id="prN">Ingen</button></div>
 <div class="prl">${B.platser.map(p=>`<label class="row"><input type="checkbox" data-pr="${esc(p.id)}" checked><span><b>${esc(p.id)}</b> ${esc(p.namn)}<span class="st" style="display:block">${placeUses(p.id).length} uppdrag</span></span></label>`).join('')}</div>
 <div class="acts"><button class="btn" id="mC">Avbryt</button><button class="btn gold" id="prGo">Skriv ut</button></div>`);
 const boxes=()=>[...document.querySelectorAll('[data-pr]')];
 $('#prA').onclick=()=>boxes().forEach(b=>b.checked=true);

}

 const pages=ids.map(PL).filter(Boolean).map(p=>{const us=placeUses(p.id);return `<div class="pg"><div class="qr">${qrSvg('HEMTAM:'+p.id)}</div>
  <div class="ft"><div class="f1">${esc(p.id)} · ${esc(p.namn)}</div><div class="f2">${us.length?us.map(esc).join(' · '):'Används inte i något uppdrag – fri instämpling'}</div><div class="f3">${esc(B.namn)} · utskriven ${today()} · HEMTAM</div></div></div>`}).join('');

/* ===== Kryptering (AES-GCM, nyckel från delningskoden) ===== */
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(kod,sl){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(kod),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:sl,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(txt,kod){const sl=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await keyFrom(kod,sl);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt));return JSON.stringify({typ:'hemtam_krypterad',v:1,salt:b64(sl),iv:b64(iv),data:b64(ct)})}
async function decrypt(txt,kod){const o=typeof txt==='string'?JSON.parse(txt):txt;const k=await keyFrom(kod,unb64(o.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.data));return new TextDecoder().decode(pt)}
